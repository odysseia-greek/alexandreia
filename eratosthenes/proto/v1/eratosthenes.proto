syntax = "proto3";

package eratosthenes.v1;

option go_package = "github.com/odysseia-greek/alexandreia/eratosthenes/gen/go/v1;eratosthenesv1";

service Eratosthenes {
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}
message HealthResponse { bool ok = 1; }

message ResolveRequest {
  string term = 1;     // e.g. "εἰρήνη"
  uint32 limit = 2;    // default server-side if 0
}

message ResolveResponse {
  string term = 1;              // echo input
  string normalized_term = 2;   // what the server actually matched against
  repeated Candidate candidates = 3;
}

message Candidate {
  string lemma = 1;             // dictionary headword / lemma
  uint32 score = 2;             // 0..100 (100 best)
  repeated string glosses = 3;  // optional: short defs for logging/UI
  string entry_id = 4;          // optional, leave empty if not available
}